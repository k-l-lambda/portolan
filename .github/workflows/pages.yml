name: Deploy demo to GitHub Pages

# Builds a static, read-only copy of the web view showing docs/portolan.rhumb (the project's
# own map) and deploys it to GitHub Pages. One-time setup: repository Settings -> Pages ->
# Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: [docs/**, web/**, src/**, scripts/build-pages.ts, package.json, pnpm-lock.yaml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history: the view shows how recently each item changed (git blame)

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0 # version comes from "packageManager" in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the static demo
        run: pnpm build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
